<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150" fill="none">
  <!-- Circular Background -->
  <circle cx="75" cy="75" r="75" fill="#059467"/>
  
  <!-- Calculator body (narrower) with white border -->
  <rect x="40" y="30" width="70" height="87" rx="8" fill="#0f7056" stroke="#fff" stroke-width="2"/>
  
  <!-- LED Display -->
  <rect x="48" y="40" width="54" height="19" rx="4" fill="#ffffff"/>
  
  <!-- Button grid (dots) - 3 columns, reduced gap -->
  <circle cx="55" cy="67" r="4.5" fill="#fff"/>
  <circle cx="75" cy="67" r="4.5" fill="#fff"/>
  <circle cx="95" cy="67" r="4.5" fill="#fff"/>
  
  <circle cx="55" cy="82" r="4.5" fill="#fff"/>
  <circle cx="75" cy="82" r="4.5" fill="#fff"/>
  
  <circle cx="55" cy="97" r="4.5" fill="#fff"/>
  <circle cx="75" cy="97" r="4.5" fill="#fff"/>
  
  <!-- Joined button on rightmost column (bottom two) -->
  <rect x="90.5" y="82" width="9" height="24" rx="4.5" fill="#fffbfb"/>
</svg>
